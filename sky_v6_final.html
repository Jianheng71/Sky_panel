  <title>Sky — Knowledge evolves in consensus</title>
  <style>
    :root {
      --blue:#1363A8;
      --cyan:#2EA6B0;
      --light:#E8F1FA;
      --bg:#F8FAFC;
      --text:#111827;
      --white:#FFFFFF;
      --muted:#667085;
      --line:#DCE7F1;
      --green:#138A52;
      --shadow:0 4px 20px rgba(19,99,168,.06);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:var(--bg);

    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; background:var(--bg); color:var(--text); }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(19,99,168,.28); outline-offset:2px; }
    a { color:inherit; text-decoration:none; }
    .site-header { height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 max(28px,calc((100vw - 1260px)/2)); background:rgba(255,255,255,.92); border-bottom:1px solid rgba(220,231,241,.75); position:relative; z-index:2; }
    .brand { display:flex; align-items:center; min-width:100px; }
    .brand img { width:76px; height:40px; object-fit:contain; }
    .header-actions { display:flex; align-items:center; gap:10px; }
    .lang-toggle { height:28px; min-width:54px; border-radius:99px; padding:0 12px; border:1px solid var(--light); color:var(--text); background:var(--white); font-size:12px; }
    .lang-toggle:hover { border-color:var(--blue); }
    .header-link { border:0; background:transparent; padding:9px 12px; color:#344054; font-size:14px; }
    .header-link:hover { color:var(--blue); }
    .btn-sky { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:10px; padding:11px 17px; color:#fff; font-weight:600; background:var(--blue); transition:background .18s,transform .18s,box-shadow .18s; }
    .btn-sky:hover { background:#0A3D8F; box-shadow:0 5px 16px rgba(19,99,168,.2); transform:translateY(-1px); }
    .btn-sky:active { transform:translateY(0); }
    .btn-quiet { border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:#344054; background:#fff; }
    .btn-quiet:hover { border-color:#9bbbd6; color:var(--blue); }
    .page-shell { width:min(1260px,calc(100% - 48px)); margin:0 auto; }
    .hero { height:200px; background:linear-gradient(180deg,var(--light) 0%,#fff 100%); text-align:center; padding:20px 24px 22px; }
    .hero-logo { display:block; width:220px; height:90px; object-fit:contain; margin:0 auto 7px; }
    .hero-subtitle { margin:0; color:#667085; font-size:13px; letter-spacing:.02em; }
    .search-area { width:min(760px,calc(100% - 40px)); margin:-19px auto 0; position:relative; z-index:1; }
    .search-form { display:flex; gap:10px; }
    .search-input { height:52px; flex:1; min-width:0; padding:0 19px; border:1.5px solid var(--light); border-radius:28px; background:var(--white); color:var(--text); box-shadow:0 3px 14px rgba(22,49,82,.045); transition:border-color .18s,box-shadow .18s; }
    .search-input:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 4px rgba(19,99,168,.12); }
    .search-form .btn-sky { height:52px; min-width:114px; border-radius:28px; }
    .hero-actions { display:flex; justify-content:center; gap:11px; padding-top:15px; }
    .hero-actions button { min-width:124px; }
    .section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin:36px 0 18px; }
    .section-heading h1,.section-heading h2 { margin:0; font-size:20px; letter-spacing:-.02em; }
    .section-heading p { margin:0; color:var(--muted); font-size:13px; }
    .wiki-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding-bottom:60px; }
    .wiki-card { min-height:176px; display:flex; flex-direction:column; padding:21px; border:1.5px solid var(--light); border-radius:16px; background:#fff; box-shadow:var(--shadow); transition:transform .18s,border-color .18s,box-shadow .18s; cursor:pointer; }
    .wiki-card:hover { transform:translateY(-3px); border-color:#bfd6ea; box-shadow:0 10px 26px rgba(19,99,168,.1); }
    .card-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .card-tag { padding:5px 9px; border-radius:99px; background:#eff7fb; color:#277d92; font-size:11px; font-weight:600; }
    .card-votes { color:var(--muted); font-size:12px; }
    .wiki-card h3 { margin:18px 0 9px; font-size:17px; line-height:1.4; }
    .wiki-card p { margin:0; color:#667085; font-size:13px; line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-author { display:flex; align-items:center; gap:7px; margin-top:auto; padding-top:14px; color:#7b8492; font-size:11px; }
    .avatar { width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; flex:none; border-radius:50%; color:#fff; background:linear-gradient(145deg,#48aeb5,#1363a8); font-size:11px; font-weight:700; }
    .avatar.large { width:96px; height:96px; font-size:28px; box-shadow:0 8px 24px rgba(19,99,168,.14); }
    .empty-state { grid-column:1/-1; padding:54px 20px; text-align:center; color:#7a8492; border:1px dashed #cbd8e4; border-radius:16px; background:#fff; }
    .empty-state strong { display:block; margin-bottom:8px; color:#344054; font-size:16px; }
    .site-footer { padding:22px 0 34px; color:#98a2b3; border-top:1px solid var(--line); text-align:center; font-size:12px; }
    .article-head { padding:34px 0 22px; }
    .breadcrumbs { margin-bottom:14px; color:#7c8795; font-size:12px; }
    .breadcrumbs button { border:0; padding:0; color:var(--blue); background:none; font-size:inherit; }
    .article-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
    .article-title-row h1 { margin:0; font-size:34px; line-height:1.2; letter-spacing:-.035em; }
    .article-meta { display:flex; align-items:center; gap:8px; margin-top:14px; color:#7b8492; font-size:12px; }
    .article-layout { display:grid; grid-template-columns:220px minmax(0,1fr) 245px; gap:22px; align-items:start; padding-bottom:72px; }
    .side-card,.info-card { position:sticky; top:18px; padding:18px; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .side-card h2,.info-card h2 { margin:0 0 13px; font-size:13px; }
    .toc { display:flex; flex-direction:column; gap:4px; }
    .toc a { padding:7px 9px; border-radius:7px; color:#687385; font-size:12px; line-height:1.4; }
    .toc a:hover { color:var(--blue); background:#f0f6fb; }
    .blocks { display:flex; flex-direction:column; gap:14px; }
    .article-block { position:relative; padding:20px 22px 15px; border:1px solid #e6edf4; border-left:4px solid var(--cyan); border-radius:11px; background:#fff; box-shadow:0 3px 14px rgba(16,40,70,.035); scroll-margin-top:20px; }
    .article-block h2 { margin:0 0 12px; font-size:21px; line-height:1.35; }
    .article-block p,.block-content { margin:0; color:#3f4a5a; font-size:14px; line-height:1.85; overflow-wrap:anywhere; }
    .article-block blockquote { margin:0; padding:3px 0 3px 14px; color:#3f4a5a; border-left:2px solid #b6d8dc; line-height:1.8; white-space:pre-wrap; }
    .article-block pre { white-space:pre-wrap; overflow-wrap:anywhere; color:#334155; background:#f4f7fa; padding:13px; border-radius:8px; font-size:12px; }
    .block-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:11px; border-top:1px solid #f0f2f5; }
    .block-author { display:flex; align-items:center; gap:6px; color:#8a94a3; font-size:11px; }
    .block-actions { display:flex; align-items:center; gap:5px; }
    .vote-btn { display:flex; align-items:center; gap:4px; padding:5px 7px; border:0; border-radius:7px; color:#748091; background:transparent; font-size:11px; }
    .vote-btn:hover { color:var(--blue); background:#f1f6fa; }
    .contributor-stack { display:flex; align-items:center; margin-right:5px; }
    .contributor-stack .avatar { width:23px; height:23px; margin-left:-6px; border:2px solid white; box-shadow:0 1px 4px rgba(16,24,40,.2); animation:greenFlash 1.1s ease-out; }
    .contributor-stack .avatar:first-child { margin-left:0; }
    @keyframes greenFlash { 0% { box-shadow:0 0 0 0 rgba(34,197,94,.8); background:#22c55e; } 100% { box-shadow:0 0 0 7px rgba(34,197,94,0); } }
    .info-row { display:grid; grid-template-columns:1fr; gap:4px; padding:9px 0; border-top:1px solid #eff2f5; font-size:11px; }
    .info-row span { color:#8993a1; }
    .info-row strong { font-weight:500; overflow-wrap:anywhere; }
    .info-empty { color:#8993a1; font-size:12px; line-height:1.6; }
    .article-notice { margin:0 0 15px; padding:12px 14px; border:1px solid #cde8d8; border-radius:9px; color:#226742; background:#f0fbf4; font-size:13px; }
    .backend-alert { margin:18px 0 0; padding:13px 16px; border:1px solid #f2c7c4; border-radius:10px; color:#8f2822; background:#fff5f4; font-size:13px; line-height:1.6; }
    .proposal-panel { margin-top:18px; padding:17px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .proposal-panel h2 { margin:0 0 8px; font-size:16px; }
    .proposal-panel p { margin:0 0 12px; color:#667085; font-size:12px; line-height:1.6; }
    .profile-wrap { width:min(420px,100%); margin:54px auto 80px; text-align:center; }
    .profile-wrap h1 { margin:19px 0 5px; font-size:24px; }
    .profile-wrap .profile-bio { margin:0 0 24px; color:#778292; font-size:13px; }
    .profile-links { display:flex; flex-direction:column; gap:11px; }
    .profile-links button { min-height:48px; width:100%; padding:10px 16px; border:1px solid var(--light); border-radius:99px; color:#243347; background:#fff; box-shadow:0 3px 12px rgba(19,99,168,.05); text-align:center; }
    .profile-links button:hover { border-color:#a9cce6; color:var(--blue); transform:translateY(-1px); }
    .profile-caption { margin-top:22px; color:#a0a8b3; font-size:11px; }
    .admin-shell { min-height:calc(100vh - 68px); display:grid; grid-template-columns:225px 1fr; background:#fff; }
    .admin-sidebar { padding:24px 16px; color:#c6d0db; background:#111827; }
    .admin-brand { display:flex; align-items:center; padding:3px 9px 28px; }
    .admin-brand img { width:90px; height:42px; object-fit:contain; }
    .admin-sidebar-label { padding:12px 10px 7px; color:#697586; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .admin-nav { width:100%; display:flex; align-items:center; gap:10px; padding:11px 10px; border:0; border-radius:7px; color:#c6d0db; background:transparent; text-align:left; font-size:13px; }
    .admin-nav.active,.admin-nav:hover { color:#fff; background:#263447; }
    .admin-main { min-width:0; padding:35px clamp(22px,5vw,68px); background:#fff; }
    .admin-main-inner { max-width:950px; margin:0 auto; }
    .admin-main h1 { margin:0 0 8px; font-size:25px; letter-spacing:-.03em; }
    .admin-lead { margin:0 0 27px; color:#788394; font-size:13px; line-height:1.6; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
    .field label { color:#475467; font-size:12px; font-weight:600; }
    .field input,.field textarea { width:100%; border:1px solid #d8dee7; border-radius:7px; padding:10px 11px; color:#182230; background:#fff; font-size:13px; }
    .field input:focus,.field textarea:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 3px rgba(19,99,168,.11); }

    .field-hint { color:#929baa; font-size:11px; line-height:1.5; }
    .form-actions { display:flex; flex-wrap:wrap; gap:9px; }

    .preview-box h3 { margin:0 0 9px; font-size:13px; }
    .preview-box p,.preview-box li { color:#667085; font-size:12px; line-height:1.65; }
    .seeded-list { display:flex; flex-direction:column; }
    .seeded-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid #edf0f4; }
    .seeded-item:first-child { border-top:0; }
    .seeded-item strong { display:block; font-size:13px; }
    .seeded-item small { display:block; margin-top:4px; color:#8993a1; font-size:11px; }
    .delete-btn { border:1px solid #f1d4d4; border-radius:7px; padding:7px 10px; color:#b42318; background:#fff; font-size:11px; }
    .delete-btn:hover { background:#fff3f2; }
    .login-card { width:min(390px,100%); margin:70px auto; padding:28px; border:1px solid #e5e9ef; border-radius:12px; background:#fff; box-shadow:0 8px 32px rgba(16,24,40,.07); }
    .login-card h1 { margin:0 0 8px; font-size:23px; }
    .login-card p { margin:0 0 22px; color:#788394; font-size:13px; line-height:1.6; }
    .toast { position:fixed; right:22px; bottom:22px; z-index:10; max-width:min(460px,calc(100vw - 44px)); padding:13px 16px; border-radius:10px; color:#fff; background:#1f2937; box-shadow:0 10px 30px rgba(16,24,40,.22); font-size:13px; animation:toastIn .2s ease-out; }
    .toast.error { background:#9f2d27; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:1000px) {
      .article-layout { grid-template-columns:185px minmax(0,1fr); }
      .info-card { position:static; grid-column:2; }
      .wiki-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:680px) {
      .site-header { height:60px; padding:0 16px; }
      .brand img { width:65px; }
      .header-actions { gap:2px; }
      .header-link { padding:8px; font-size:12px; }
      .page-shell { width:min(100% - 32px,500px); }
      .hero { height:188px; }
      .hero-logo { height:83px; }
      .search-area { width:calc(100% - 24px); }
      .search-input { padding:0 14px; font-size:13px; }
      .search-form .btn-sky { min-width:82px; padding:0 13px; font-size:13px; }
      .hero-actions button { min-width:112px; font-size:12px; }
      .section-heading { align-items:flex-start; flex-direction:column; margin-top:30px; }
      .wiki-grid { grid-template-columns:1fr; gap:12px; }
      .wiki-card { min-height:155px; }
      .article-title-row { flex-direction:column; }
      .article-title-row h1 { font-size:28px; }
      .article-layout { grid-template-columns:1fr; gap:14px; }
      .side-card,.info-card { position:static; grid-column:auto; }
      .side-card { order:0; }
      .blocks { order:1; }
      .info-card { order:2; }
      .toc { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .admin-shell { grid-template-columns:1fr; }
      .admin-sidebar { display:flex; align-items:center; gap:5px; padding:8px 12px; overflow:auto; }
      .admin-brand { padding:0 7px; }
      .admin-brand img { width:68px; height:34px; }
      .admin-sidebar-label { display:none; }
      .admin-nav { width:auto; flex:none; padding:9px 10px; font-size:11px; }
      .admin-main { padding:25px 16px; }
      .form-grid { grid-template-columns:1fr; gap:0; }
      .seeded-item { align-items:flex-start; }
    }
  </style>
</head>

        document.documentElement.lang = state.lang;
        app.innerHTML = state.page === "article" ? renderArticle()
          : state.page === "profile" ? renderProfile()
          : state.page === "admin" ? renderAdmin()
          : renderHome();
        const heroLogo = document.getElementById("heroLogo");
        if (heroLogo) heroLogo.src = logoSources.light;
      }
      function parseWiki(raw) {
        const lines = String(raw).replace(/\r\n?/g,"\n").split("\n");
        const blocks = [];
        let info = {};
        let paragraph = [];
        let blockType = "";
        let blockLines = [];
        const flushParagraph = () => {
          const content = paragraph.join("\n").trim();
          if (content) blocks.push({type:"text",content});
          paragraph = [];
        };
        const flushBlock = () => {
          const content = blockLines.join("\n").trim();
          if (content) blocks.push({type:blockType || "text",content});
          blockLines = [];
          blockType = "";
        };
        for (let i=0;i<lines.length;i++) {
          const line = lines[i];
          const trimmed = line.trim();
          if (blockType) {
            if (/^:::\s*$/.test(trimmed)) flushBlock();
            else blockLines.push(line);
            continue;
          }
          if (!trimmed) { flushParagraph(); continue; }
          if (trimmed.startsWith("@info")) {
            flushParagraph();
            const initial = trimmed.slice(5).trim();
            const jsonLines = initial ? [initial] : [];
            let jsonText = jsonLines.join("\n");
            let depth = 0;
            let opened = false;
            let inString = false;
            let escaped = false;
            const scanJson = text => {
              for (const char of text) {
                if (inString) {
                  if (escaped) escaped = false;
                  else if (char === "\\") escaped = true;
                  else if (char === '"') inString = false;
                } else if (char === '"') inString = true;
                else if (char === "{") { depth++; opened = true; }
                else if (char === "}") depth--;
              }
            };
            scanJson(jsonText);
            while (!opened || depth > 0) {
              if (i + 1 >= lines.length) break;
              const next = lines[++i];
              jsonLines.push(next);
              scanJson(next);
            }
            jsonText = jsonLines.join("\n").trim();
            try {
              const parsed = JSON.parse(jsonText);
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("@info must contain a JSON object");
              info = parsed;
            } catch (error) {
              throw new Error(`@info: ${error.message}`);
            }
            continue;
          }
          const blockStart = trimmed.match(/^:::block\s+([a-zA-Z0-9_-]+)\s*$/);
          if (blockStart) {
            flushParagraph();
            blockType = blockStart[1].toLowerCase();
            blockLines = [];
            continue;
          }
          if (trimmed.startsWith("## ")) {
            flushParagraph();
            blocks.push({type:"heading",content:trimmed.slice(3).trim()});
            continue;
          }
          paragraph.push(line);
        }
        flushParagraph();
        if (blockType) flushBlock();
        return {blocks,info};
      }
      function formValue(form,name) { return new FormData(form).get(name)?.toString() || ""; }
      function serializeArticle(article) {
        const info = Object.keys(article.info || {}).length ? `@info ${JSON.stringify(article.info,null,2)}\n\n` : "";
        return info + article.blocks.map(block => block.type === "heading"
          ? `## ${block.content}`
          : block.type === "text"
            ? block.content
            : `:::block ${block.type}\n${block.content}\n:::`).join("\n\n");
      }
      async function publishSeed(form) {
        const id = formValue(form,"id").trim();
        const title = formValue(form,"title").trim();
        const raw = formValue(form,"raw");
        state.seedDraft = {id,title,raw};
        if (!id || !title || !raw.trim()) { showToast(t("missingFields"),true); return; }
        if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)) { showToast(t("invalidId"),true); return; }
        try {
          const parsed = parseWiki(raw);
          const article = {
            id,title,blocks:parsed.blocks.map(block => ({...block,author:state.user || "Sky Official",avatar:avatarLetter(state.user || "Sky Official"),votes:{ok:10,fail:0,copy:0}})),
            info:parsed.info,author:state.user || "Sky Official",avatar:avatarLetter(state.user || "Sky Official"),
            mainVersion:{author:"Sky Official",votes:{ok:10,fail:0,copy:0}},updatedAt:new Date().toISOString()
          };
          await requestSupabase("sky_articles?on_conflict=id",{method:"POST",body:[toArticleRow(article)],prefer:"resolution=merge-duplicates,return=minimal"});
          await loadArticles();
          state.preview = null;
          state.seedDraft = null;
          state.query = "";
          render();
          showToast(t("published"));
        } catch (error) { showToast(error.message,true); }
      }
      function exportDb() {
        const blob = new Blob([JSON.stringify(state.db,null,2)],{type:"application/json"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "sky_wiki_db.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        showToast(t("exportReady"));
      }
      async function importDb(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          void (async () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            if (!Array.isArray(parsed)) throw new Error(t("invalidDb"));
            const clean = parsed.map(normalizeWiki);
            if (clean.some(item => !item)) throw new Error(t("invalidDb"));
            if (clean.length) {
              await requestSupabase("sky_articles?on_conflict=id",{method:"POST",body:clean.map(toArticleRow),prefer:"resolution=merge-duplicates,return=minimal"});
            }
            await loadArticles();
            render();
            showToast(t("importSuccess"));
          } catch (error) { showToast(error.message,true); }
          })();
        };
        reader.onerror = () => showToast(t("invalidJson") + (reader.error?.message || "File read error"),true);
        reader.readAsText(file);
      }
      async function importLegacyDb() {
        let raw;
        try { raw = localStorage.getItem(LEGACY_DB_KEY); }
        catch (error) { showToast(t("storageError") + error.message,true); return; }
        if (!raw) { showToast(t("noneSeeded"),true); return; }
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new Error(t("invalidDb"));
          const articles = parsed.map(normalizeWiki);
          if (articles.some(article => !article)) throw new Error(t("invalidDb"));
          if (!articles.length) { showToast(t("noneSeeded"),true); return; }
          await requestSupabase("sky_articles?on_conflict=id",{method:"POST",body:articles.map(toArticleRow),prefer:"resolution=merge-duplicates,return=minimal"});
          await loadArticles();
          render();
          showToast(t("importSuccess"));
        } catch (error) { showToast(t("invalidJson") + error.message,true); }
      }
      function setPage(page) {
        state.page = page;
        state.preview = null;
        state.proposalId = "";
        state.proposalDraft = "";
        state.flashBlock = -1;
        const nextHash = page === "admin" ? "#admin" : "";
        if (window.location.hash !== nextHash) {
          window.history.replaceState(null,"",window.location.pathname + window.location.search + nextHash);
        }
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      }
      function openArticle(id) {
        state.articleId = id;
        setPage("article");
      }
      async function vote(index,kind) {
        try {
          await requestSupabase("rpc/sky_vote_block",{method:"POST",body:{p_article_id:state.articleId,p_block_index:index,p_kind:kind}});
          await loadArticles();
          render();
        } catch (error) { showToast(error.message,true); }
      }
      async function copyBlock(index) {
        const articleIndex = state.db.findIndex(item => item.id === state.articleId);
        const article = state.db[articleIndex];
        if (!article || !article.blocks[index]) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(article.blocks[index].content);
          } else {
            const field = document.createElement("textarea");
            field.value = article.blocks[index].content;
            field.setAttribute("readonly","");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            const copied = document.execCommand("copy");
            field.remove();
            if (!copied) throw new Error("Clipboard copy was denied");
          }
          await requestSupabase("rpc/sky_vote_block",{method:"POST",body:{p_article_id:state.articleId,p_block_index:index,p_kind:"copy"}});
          await loadArticles();
          render();
          showToast(t("copied"));
        } catch (error) {
          showToast(error.message || t("toastCopyError"),true);
        }
      }
      async function saveProposal(form) {
        const content = formValue(form,"proposal").trim();
        if (!content) { showToast(t("emptyProposal"),true); return; }
        const article = state.db.find(item => item.id === state.articleId);
        if (!article) return;
        try {
          await requestSupabase("sky_edit_proposals",{method:"POST",body:{article_id:article.id,author:state.user || t("proposalLogin"),content}});
          state.proposalId = "";
          state.proposalDraft = "";
          state.flashBlock = 0;
          state.flashAuthor = state.user || t("proposalLogin");
          render();
          showToast(t("proposalSaved"));
          setTimeout(() => { state.flashBlock = -1; render(); },2600);
        } catch (error) { showToast(error.message,true); }
      }
      document.addEventListener("click",async event => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;
        if (action === "home") { state.query = ""; setPage("home"); }
        else if (action === "admin") setPage("admin");
        else if (action === "profile") setPage("profile");
        else if (action === "open-article") openArticle(button.dataset.id);
        else if (action === "lucky") {
          const first = state.db.find(article => !state.query || `${article.id} ${article.title}`.toLowerCase().includes(state.query.toLowerCase()));
          if (first) openArticle(first.id); else showToast(t("emptyTitle"));
        }
        else if (action === "edit") { state.proposalId = state.articleId; state.proposalDraft = ""; render(); document.querySelector(".proposal-input")?.focus(); }
        else if (action === "load-proposal") {
          const proposal = state.proposals.find(item => String(item.id) === button.dataset.proposalId);
          const article = proposal && state.db.find(item => item.id === proposal.article_id);
          if (proposal && article) {
            state.seedDraft = {id:article.id,title:article.title,raw:proposal.content};
            state.preview = null;
            render();
            document.getElementById("seedForm")?.scrollIntoView({behavior:"smooth",block:"start"});
          }
        }
        else if (action === "cancel-proposal") { state.proposalId = ""; state.proposalDraft = ""; render(); }
        else if (action === "vote") vote(Number(button.dataset.index),button.dataset.kind);
        else if (action === "copy") copyBlock(Number(button.dataset.index));
        else if (action === "preview-parse") {
          const form = document.getElementById("seedForm");
          state.seedDraft = {
            id:formValue(form,"id"),
            title:formValue(form,"title"),
            raw:formValue(form,"raw")
          };
          try {
            const parsed = parseWiki(state.seedDraft.raw);
            state.preview = {...parsed,title:state.seedDraft.title};
            render();
          } catch (error) { showToast(t("parseError") + error.message,true); }
        }
        else if (action === "export") exportDb();
        else if (action === "import") document.getElementById("importFile")?.click();
        else if (action === "import-local") await importLegacyDb();
        else if (action === "delete") {
          if (!window.confirm(t("confirmDelete"))) return;
          try {
            await requestSupabase(`sky_articles?id=eq.${encodeURIComponent(button.dataset.id)}`,{method:"DELETE"});
            await loadArticles();
            render();
            showToast(t("deleted"));
          } catch (error) { showToast(error.message,true); }
        }
        else if (action === "logout") {
          try {
            if (state.session?.access_token) {
              await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${state.session.access_token}`}});
            }
          } catch (error) { console.error("Supabase sign-out failed",error); }
          clearSession();
          state.user = null;
          setPage("admin");
        }
        else if (action === "new-seed") { setPage("admin"); setTimeout(() => document.querySelector('[name="id"]')?.focus(),0); }
        else if (action === "library") { state.query = ""; setPage("home"); }
      });
      document.addEventListener("submit",async event => {
        const form = event.target;
        if (form.id === "searchForm") {
          event.preventDefault();
          state.query = formValue(form,"query").trim();
          const exact = state.db.find(article => article.id.toLowerCase() === state.query.toLowerCase());
          if (exact) openArticle(exact.id); else { setPage("home"); }
        } else if (form.id === "loginForm") {
          event.preventDefault();
          try {
            const email = formValue(form,"email").trim();
            const password = formValue(form,"password");
            const session = await authRequest("token?grant_type=password",{email,password});
            setSession(session);
            state.authUser = session.user;
            if (!await checkAdmin()) {
              clearSession();
              showToast(t("adminNotAllowed"),true);
              return;
            }
            state.adminLoggedIn = true;
            state.user = session.user?.email || email;
            await loadProposals();
            render();
            showToast(t("loggedIn"));
          } catch (error) {
            showToast(error.message || t("invalidLogin"),true);
          }
        } else if (form.id === "seedForm") {
          event.preventDefault();
          await publishSeed(form);
        } else if (form.id === "proposalForm") {
          event.preventDefault();
          await saveProposal(form);
        }
      });
      document.addEventListener("change",event => {
        if (event.target.id === "importFile") importDb(event.target.files && event.target.files[0]);
      });
      document.addEventListener("input",event => {
        if (event.target.closest("#seedForm")) {
          const form = document.getElementById("seedForm");
          state.seedDraft = {
            id:formValue(form,"id"),
            title:formValue(form,"title"),
            raw:formValue(form,"raw")
          };
        } else if (event.target.closest("#proposalForm")) {
          state.proposalDraft = formValue(document.getElementById("proposalForm"),"proposal");
        }
      });
      document.getElementById("langToggle").addEventListener("click",() => {
        state.lang = state.lang === "zh" ? "en" : "zh";
        try { localStorage.setItem(LANG_KEY,state.lang); }
        catch (error) { showToast(t("storageError") + error.message,true); }
        render();
      });
      document.addEventListener("keydown",event => {
        const card = event.target.closest && event.target.closest('.wiki-card[data-action="open-article"]');
        if (card && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          openArticle(card.dataset.id);
        }
      });
      render();
      async function initializeBackend() {
        try {
          await loadArticles();
          if (state.session?.access_token) {
            state.authUser = state.session.user || null;
            if (await checkAdmin()) {
              state.adminLoggedIn = true;
              state.user = state.authUser?.email || "";
              await loadProposals();
            } else {
              clearSession();
            }
          }
        } catch (error) {
          state.backendError = error.message;
          if (state.session?.access_token && !state.adminLoggedIn) clearSession();
        } finally {
          state.loading = false;
          render();
        }
      }
      void initializeBackend();
    })();
  </script>
</body>
</html>
